name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "admin/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "name=docker.io/${DOCKERHUB_USERNAME}/aprax-tmaii-backend" >> "$GITHUB_OUTPUT"
            echo "push_registry=dockerhub" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${OWNER,,}/aprax-tmaii-backend" >> "$GITHUB_OUTPUT"
            echo "push_registry=ghcr" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.image.outputs.push_registry == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.image.outputs.push_registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH (optional)
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            # Server must already have .env and docker-compose.yml staged (never in git).
            if [ -f docker-compose.yml ]; then
              docker compose pull backend || true
              docker compose up -d backend
            fi
            echo "Deploy finished for ${{ github.sha }}"
